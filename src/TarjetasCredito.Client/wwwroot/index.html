<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <!-- maximum-scale=1/user-scalable=no bloquea el pellizco-para-zoom (ver SPEC-005 "Bloqueo de zoom
         táctil"): bug real reportado por el usuario — al hacer zoom con los dedos o al enfocar/cerrar
         el teclado móvil, la app perdía su encuadre fijo y aparecía scroll libre en todas direcciones,
         rompiendo la sensación de app instalada. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#3B5BFE" />
    <title>Tarjetas de Crédito</title>
    <base href="/" />
    <link rel="preload" id="webassembly" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="TarjetasCredito.Client.styles.css" rel="stylesheet" /> -->
    <link href="manifest.webmanifest" rel="manifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="favicon-64.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="icon-512.png" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <script type="importmap"></script>
    <script>
        (function () {
            try {
                var tema = localStorage.getItem('tarjetascredito.theme') || 'light';
                document.documentElement.setAttribute('data-theme', tema);
            } catch (e) { /* localStorage no disponible */ }
        })();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11.14.5/dist/sweetalert2.all.min.js"></script>
    <script src="js/dialogs.js"></script>
    <script src="js/parallaxStage.js"></script>
    <script src="js/navWave.js"></script>
    <script src="js/faceIdAuth.js"></script>
    <script src="js/webPush.js"></script>
    <script src="js/domUtils.js"></script>
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        Ocurrió un error inesperado.
        <a href="." class="reload">Recargar</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_framework/blazor.webassembly.js"></script>
    <script>navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' });</script>
</body>

</html>
